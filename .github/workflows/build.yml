name: Build MSFS Tracker

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pyinstaller
        pip install git+https://github.com/odwdinc/Python-SimConnect.git

    - name: Build executable
      run: |
        pyinstaller --onefile --windowed --name "LibroDeVuelo-Tracker" --icon=src/icon.ico src/tracker.py
      continue-on-error: true

    - name: Build executable (no icon)
      run: |
        pyinstaller --onefile --windowed --name "LibroDeVuelo-Tracker" src/tracker.py

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: LibroDeVuelo-Tracker-Windows
        path: dist/LibroDeVuelo-Tracker.exe

    - name: Create Release
      uses: softprops/action-gh-release@v1
      if: github.ref == 'refs/heads/main'
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: Libro de Vuelo Tracker v1.0.${{ github.run_number }}
        body: |
          ## Libro de Vuelo - Tracker Automatico

          ### Instalacion
          1. Descarga `LibroDeVuelo-Tracker.exe`
          2. Ejecutalo (puede pedir permiso de Windows - clic en "Mas informacion" > "Ejecutar de todas formas")
          3. Inicia sesion con tu cuenta de Libro de Vuelo
          4. Abre MSFS 2020 y clic en "Conectar a MSFS"
          5. Vola - tus vuelos se guardan automaticamente!

        files: dist/LibroDeVuelo-Tracker.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
