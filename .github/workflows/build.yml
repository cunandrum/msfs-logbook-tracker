name: Build MSFS Tracker

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pyinstaller
        pip install pyuipc || echo "pyuipc not available, continuing"
        pip install git+https://github.com/odwdinc/Python-SimConnect.git || echo "SimConnect not available, continuing"

    - name: Build executable
      run: |
        pyinstaller --onefile --windowed --name "LibroDeVuelo-Tracker" src/tracker.py

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: LibroDeVuelo-Tracker-Windows
        path: dist/LibroDeVuelo-Tracker.exe
